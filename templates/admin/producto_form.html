{% extends 'base.html' %}
{% block title %}Editar Producto | Admin{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2rem;
        background-color: var(--secondary-color);
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .form-container h1 {
        margin-bottom: 1.5rem;
        color: var(--primary-color);
        text-align: center;
    }
    .admin-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    .admin-form label {
        font-weight: bold;
    }
    .admin-form input, .admin-form textarea {
        padding: 0.8rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        width: 100%;
        box-sizing: border-box;
    }
    .btn-save {
        background-color: var(--primary-color);
        color: #fff;
        border: none;
        padding: 1rem;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 1rem;
    }
    .btn-save:hover {
        background-color: #d17500;
    }
    .back-btn {
        display: block;
        margin-bottom: 1rem;
        color: var(--primary-color);
        text-decoration: none;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <a href="{{ url_for('admin_productos') }}" class="back-btn">&larr; Cancelar y Volver</a>
    <h1>Editar Producto</h1>
    
    <form class="admin-form" method="POST" action="{{ url_for('editar_producto', id=producto.id) }}">
        <label for="titulo">Título del Producto:</label>
        <input type="text" id="titulo" name="titulo" value="{{ producto.titulo }}" required>

        <label for="precio">Precio ($):</label>
        <input type="number" id="precio" name="precio" value="{{ producto.precio }}" step="0.01" required>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="4" required>{{ producto.descripcion }}</textarea>

        <label for="imagenUrl">URL de la Imagen:</label>
        <input type="url" id="imagenUrl" name="imagenUrl" value="{{ producto.imagenUrl }}" placeholder="https://...">

        <button type="submit" class="btn-save">Guardar Cambios</button>
    </form>
</div>
{% endblock %}
