{% extends 'base.html' %}
{% block title %}Panel de Administración | Catfetería{% endblock %}

{% block extra_css %}
<style>
    .admin-container {
        max-width: 1000px;
        margin: 3rem auto;
        padding: 2rem;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .admin-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .admin-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
    }
    .admin-card {
        background-color: var(--secondary-color);
        padding: 2rem;
        border-radius: 8px;
        text-align: center;
        text-decoration: none;
        color: var(--text-color);
        transition: transform 0.3s;
        border: 2px solid transparent;
    }
    .admin-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary-color);
    }
    .admin-card i {
        font-size: 3rem;
        color: var(--primary-color);
        margin-bottom: 1rem;
        display: block;
    }
</style>
{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="admin-header">
        <h1>Panel de Administración</h1>
        <p>Bienvenido, {{ current_user.nombre }}</p>
    </div>

    <div class="admin-grid">
        <a href="{{ url_for('admin_productos') }}" class="admin-card">
            <i class="bi bi-cup-hot"></i>
            <h2>Gestionar Productos</h2>
        </a>
        <a href="{{ url_for('admin_gatos') }}" class="admin-card">
            <i class="bi bi-balloon-heart"></i>
            <h2>Gestionar Gatos</h2>
        </a>
        <a href="{{ url_for('admin_usuarios') }}" class="admin-card">
            <i class="bi bi-people"></i>
            <h2>Usuarios Registrados</h2>
        </a>
    </div>
</div>
{% endblock %}
